    <script>
        var a = 4;
        if (a > 5) {
            alert("5 초과");
        } else if (a > 3) {
            alert("3 < a < 5");
        } else {
            alert("나머지");
        }

        // 언제 switch-case : 권한설정

        switch (a) {
            case 4:
                alert("a는 4")
                alert("ㅋㅋ")
                break;
            case 10:
                alert("a는 10")
                break;
            default:
                alert("나머지");
                break;
        }

        var role = "DBU";
