<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>1120</title>
    <script>
        // vanilla : 기본

        // 1) 함수 정의
        // 2) HTML DOM객체의 onXXX에 연결
        // -> 작업형태상 작업이 불편

        // 인터프리터 방식 언어 + 문법이 길다
        // -> 에러잡기 힘듬
        // -> vanilla JS는 역사적으로 개발자들에게 외면받아왔음
        // vanilla JS는 여전히 불편
        // jQuery라는 JS라이브러리가 나오면서 JS를 쓰기 시작
        // 본격적으로 JS라이브러리 시장이 발전 -> React/Vue

        // callback함수
        //      직접 호출x
        //      이벤트에 연결시켜놔서, 그 이벤트가 발생하면 자동호출되는 함수
        function abcd() {
            alert("ㅋㅋㅋ");
        }
        function efgh() {
            alert("ㅎㅎㅎㅎㅎㅎ");
        }
    </script>
</head>

<body>
    <button onclick="abcd();">ㅋㅋ</button>
    <h1 ondblclick="efgh();">ㅎㅎ</h1>
</body>

</html>
