<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>1201</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.js"></script>
    <script src="jQuery.js"></script>
    <script>
        $(function () {
            // https://dapi.kakao.com/v3/search/book
            //    $.ajax({
            //         url: "https://dapi.kakao.com/v3/search/book",
            //         data: {
            //             "Authorization": "51d1ecd7656d567e9e263d69ff1ebbd4",

            //         }
            //    })
            $("button").click(function () {
                var searchTxt = $("input").val()
                $.ajax({
                    url: "https://dapi.kakao.com/v3/search/book",
                    data: { "query": searchTxt },
                    beforeSend: function (reqqq) {
                        reqqq.setRequestHeader("Authorization", "KakaoAK 51d1ecd7656d567e9e263d69ff1ebbd4")
                    },
                    success: function (bookData) {
                        $("body").append(JSON.stringify(bookData))
                        $("table").empty();
                        for (var i = 0; i < 10; i++) {
                            var title = bookData.documents[i].title;
                            var authors = bookData.documents[i].authors;
                            var imgUrl = bookData.documents[i].thumbnail;
                            var price = bookData.documents[i].price;

                            var img = $("<img>").attr("src", imgUrl);
                            var titd = $("<td></td>").text(title);
                            var autd = $("<td></td>").text(authors);
                            var pitd = $("<td></td>").text(price);

                            var tr = $("<tr></tr>").append(img, titd, autd, pitd);
                            $("table").append(tr);
                        }
                    }
                });
            });

            $("input").keyup(function (e) {
                // if (e.keyCode == 13) {
                    // 강제 이벤트 발생
                    //      $(선택자).trigger(이벤트명);
                    $("button").trigger("click");
                // }
            });
        });
    </script>
</head>

<body>
    <input> <button>검색</button>
    <hr>
    <table border="1">
    </table>
    <hr>
</body>

</html>
