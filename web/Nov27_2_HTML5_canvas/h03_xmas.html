<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>1127</title>
    <style>
        canvas {
            border: black solid 2px;
        }
    </style>
    <script src="jQuery.js"></script>
    <script>
        $(function () {
            var paper = document.getElementById("cv");
            var pen = paper.getContext("2d");

            setInterval(function () {
                pen.save();

                pen.fillStyle = "#00000011";
                pen.fillRect(0, 0, 300, 400);

                var x = Math.random() * 300;
                var y = Math.random() * 400;
                var r = Math.random() * 255;
                var g = Math.random() * 255;
                var b = Math.random() * 255;
                var color = "rgb(" + r + "," + g + "," + b + ")";
                
                pen.shadowOffsetX = 0;
                pen.shadowOffsetY = 0;
                pen.shadowBlur = 10;
                pen.shadowColor = "yellow";

                pen.fillStyle = color;
                pen.fillRect(x, y, 10, 10);

                pen.restore();
            }, 30);
        });
    </script>
</head>

<body>
    <canvas id="cv" width="300px" height="400px"></canvas>
</body>

</html>
