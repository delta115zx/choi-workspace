<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>1127</title>
    <style>
        canvas {
            border: black solid 2px;
        }
    </style>
    <script src="jQuery.js"></script>
    <script>
        $(function () {
            // HTML 4.01 : add-on프로그램(active-x, flash, ...)
            //      Flash : HTML이 그래픽을 표현불가
            // HTML 5 : 따로 add-on없이 HTML만으로 구현하자
            var paper = document.getElementById("cv");
            var pen = paper.getContext("2d");

            pen.fillRect(10, 20, 30, 40); // x, y, w, h
            pen.fillStyle = "#ff0000";
            pen.fillRect(40, 60, 100, 50);

            $("#cv").mouseup(function (e) {
                pen.fillRect(e.pageX, e.pageY, 30, 30);
            });

        });
    </script>
</head>

<body>
    <canvas id="cv" width="300px" height="400px"></canvas>
</body>

</html>
