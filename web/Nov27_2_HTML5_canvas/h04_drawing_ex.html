<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>1127</title>
    <style>
        canvas {
            border: black solid 2px;
        }
    </style>
    <script src="jQuery.js"></script>
    <script>
        // $(선택자).offset.left
        // $(선택자).offset.top
        $(function () {
            var paper = document.getElementById("cv");
            var pen = paper.getContext("2d");
            var xx = $("#cv").offset().left + 2;
            var yy = $("#cv").offset().top + 2;
            var drawMode = false;
            var startX;
            var startY;
            var endX;
            var endY;

            $("#cv").mousedown(function (e) {
                drawMode = true;
                startX = e.pageX - xx;
                startY = e.pageY - yy;
            });

            $("#cv").mousemove(function (e) {
                if (drawMode) {
                    endX = e.pageX - xx;
                    endY = e.pageY - yy;
                    pen.beginPath();
                    pen.moveTo(startX, startY);
                    pen.lineTo(endX, endY);
                    pen.closePath();
                    pen.stroke();
                    startX = endX;
                    startY = endY;
                }
            });

            $("#cv").mouseup(function (e) {
                drawMode = false;
            });

        });
    </script>
</head>

<body>
    <canvas id="cv" width="300px" height="400px"></canvas>
</body>

</html>
