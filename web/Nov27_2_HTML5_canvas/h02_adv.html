<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>1127</title>
    <style>
        canvas {
            border: black solid 2px;
        }
    </style>
    <script src="jQuery.js"></script>
    <script>
        $(function () {
            var paper = document.getElementById("cv");
            var pen = paper.getContext("2d");

            pen.save(); // 현재 펜(색, 그림자x, 선 두께...) 상태 저장

            pen.fillStyle = "red"; // 칠해진 도형 그릴때 펜 색깔
            pen.strokeStyle = "blue"; // 선 그릴때 펜 색깔
            pen.lineWidth = 3; // 선 두께

            pen.shadowOffsetX = 3;
            pen.shadowOffsetY = 3;
            pen.shadowBlur = 5;
            pen.shadowColor = "green";
            // 그림자

            pen.fillRect(10, 20, 30, 40); // 사각형 (x, y, w, h)

            // 선 그리기
            pen.beginPath();
            pen.moveTo(40, 60);
            pen.lineTo(140, 160);
            pen.closePath();
            pen.stroke();

            pen.restore(); // 저장된거 불러오기

            // 이미지파일 그리기
            var a = new Image();
            a.src = "Apple64.png";
            a.onload = function(){
                // pen.drawImage(a, 100, 200); // 그림, x, y
                pen.drawImage(a, 100, 200, 100, 50); // 그림, x, y, w, h
            };
        });
    </script>
</head>

<body>
    <canvas id="cv" width="300px" height="400px"></canvas>
</body>

</html>
